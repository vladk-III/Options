name: Collect Options Data

on:
  schedule:
    # Several attempts spread across the morning, rather than a single
    # exact-time trigger -- GitHub's scheduler is best-effort and can
    # occasionally delay or drop an individual trigger, so giving it
    # multiple independent chances (10:00, 10:30, 11:00 ET) makes an
    # actual collection landing near 10:30 far more likely. Each one is
    # near-instant if outside collect_headless.py's own ~40min window
    # around 10:30 ET, so the extra attempts cost basically nothing.
    # Both UTC offsets are listed for each target time to survive the
    # EST/EDT switch automatically (collect_headless.py's own clock
    # check decides which one, if any, actually collects).
    - cron: '0 14 * * 1-5'   # 10:00 ET (EDT)
    - cron: '30 14 * * 1-5'  # 10:30 ET (EDT)
    - cron: '0 15 * * 1-5'   # 11:00 ET (EDT) / 10:00 ET (EST)
    - cron: '30 15 * * 1-5'  # 10:30 ET (EST)
    - cron: '0 16 * * 1-5'   # 12:00 ET (EDT, watchdog) / 11:00 ET (EST)
    - cron: '0 17 * * 1-5'   # 12:00 ET (EST, watchdog)
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed to commit the updated CSV back to the repo

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collection
        run: python collect_headless.py
        env:
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Show actual file status (debug)
        run: |
          echo "--- options_data.csv ---"
          wc -l options_data.csv
          echo "--- strike_level_data.csv ---"
          wc -l strike_level_data.csv
          echo "--- daily_data.csv ---"
          wc -l daily_data.csv
          echo "--- .gitignore (if any) ---"
          cat .gitignore 2>/dev/null || echo "(no .gitignore file)"
          echo "--- git status ---"
          git status

      - name: Commit updated CSVs
        run: |
          git config user.name "options-data-bot"
          git config user.email "actions@github.com"
          git add options_data.csv strike_level_data.csv daily_data.csv
          git diff --staged --quiet || git commit -m "Update options data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
